# PipeWire Clock Configuration
# Lock the entire audio graph to 48 kHz to match LG TV S/PDIF output
# This avoids continuous resampling of the dominant source

context.properties = {
    # Default clock rate - 48 kHz matches TV S/PDIF
    default.clock.rate = 48000
    # Allow only 48 kHz - prevents resampling artifacts
    default.clock.allowed-rates = [ 48000 ]
    # Quantum for low latency
    default.clock.quantum = 1024
    default.clock.min-quantum = 512
    default.clock.max-quantum = 2048
}
