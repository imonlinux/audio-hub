# Audio Ducts - Bus to Hardware Sink
# Declarative loopbacks: bus.* → hardware sink
# Ducking multiplier is applied to these streams (not source volumes)

context.modules = [
    # duct.tv - bus.tv → hardware sink
    {
        name = libpipewire-module-loopback
        args = {
            capture.props = {
                node.name = "duct.tv.capture"
                node.description = "TV Audio to Output"
                target.object = "bus.tv"
                audio.rate = 48000
                stream.dont-remix = true
            }
            playback.props = {
                node.name = "duct.tv.playback"
                node.description = "TV Audio Output"
                target.object = "alsa_output.platform-fe00b840.mailbox.stereo-fallback"
                stream.dont-remix = true
                stream.mute = false
            }
        }
    }
    # duct.bt - bus.bt → hardware sink
    {
        name = libpipewire-module-loopback
        args = {
            capture.props = {
                node.name = "duct.bt.capture"
                node.description = "Bluetooth Audio to Output"
                target.object = "bus.bt"
                audio.rate = 48000
                stream.dont-remix = true
            }
            playback.props = {
                node.name = "duct.bt.playback"
                node.description = "Bluetooth Audio Output"
                target.object = "alsa_output.platform-fe00b840.mailbox.stereo-fallback"
                stream.dont-remix = true
                stream.mute = false
            }
        }
    }
    # duct.music - bus.music → hardware sink
    {
        name = libpipewire-module-loopback
        args = {
            capture.props = {
                node.name = "duct.music.capture"
                node.description = "Music Assistant to Output"
                target.object = "bus.music"
                audio.rate = 48000
                stream.dont-remix = true
            }
            playback.props = {
                node.name = "duct.music.playback"
                node.description = "Music Assistant Output"
                target.object = "alsa_output.platform-fe00b840.mailbox.stereo-fallback"
                stream.dont-remix = true
                stream.mute = false
            }
        }
    }
]
