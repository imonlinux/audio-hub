# Virtual Bus Sinks
# Three null-audio-sink nodes provide stable, named per-source control points
# All policy attaches to these buses, never to transient device/stream nodes
#
# monitor.channel-volumes = true is REQUIRED: without it the monitor ports
# expose the raw signal and the bus volume has NO effect on the audio the
# duct loopbacks capture (verified against PipeWire's audioconvert: the
# monitor is post-volume only when this property is set).

context.objects = [
    # bus.tv - Television audio from UR23 S/PDIF
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "bus.tv"
            node.description = "TV Audio Bus"
            media.class = "Audio/Sink"
            audio.position = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
    # bus.bt - Bluetooth A2DP streams
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "bus.bt"
            node.description = "Bluetooth Audio Bus"
            media.class = "Audio/Sink"
            audio.position = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
    # bus.music - Sendspin / Music Assistant
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "bus.music"
            node.description = "Music Assistant Bus"
            media.class = "Audio/Sink"
            audio.position = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
]
