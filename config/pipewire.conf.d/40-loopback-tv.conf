# TV Audio Loopback
# Declarative loopback: UR23 capture -> bus.tv
#
# The UR23's capture node NAME is not stable: with S/PDIF signal present the
# card runs a profile whose node is ...analog-stereo (v1-proven); with no
# signal it probes as ...stereo-fallback. The two nodes never coexist (one
# active profile per card), so we load one loopback per candidate name —
# exactly one can ever link, into the same bus.tv target.
#
# node.dont-fallback prevents linking to the default source if the UR23 is
# absent entirely. VERIFY after PipeWire upgrades: wpctl status with the TV
# on must show the UR23 input under a name covered below.

context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            # Capture from UR23 (records the source)
            capture.props = {
                node.name = "loopback.tv.capture"
                node.description = "TV Audio to Bus"
                target.object = "alsa_input.usb-HiFimeDIY_Audio_UR23_USB_SPDIF_Rx-01.analog-stereo"
                node.dont-fallback = true
                audio.rate = 48000
                stream.dont-remix = true
            }
            # Playback into bus.tv (a sink-input on the TV bus)
            playback.props = {
                node.name = "loopback.tv.playback"
                node.description = "TV Audio to Bus"
                target.object = "bus.tv"
                stream.dont-remix = true
            }
        }
    }
    {
        name = libpipewire-module-loopback
        args = {
            capture.props = {
                node.name = "loopback.tv2.capture"
                node.description = "TV Audio to Bus"
                target.object = "alsa_input.usb-HiFimeDIY_Audio_UR23_USB_SPDIF_Rx-01.stereo-fallback"
                node.dont-fallback = true
                audio.rate = 48000
                stream.dont-remix = true
            }
            playback.props = {
                node.name = "loopback.tv2.playback"
                node.description = "TV Audio to Bus"
                target.object = "bus.tv"
                stream.dont-remix = true
            }
        }
    }
]
