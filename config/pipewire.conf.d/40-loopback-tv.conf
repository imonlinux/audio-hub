# TV Audio Loopback
# Declarative loopback: UR23 capture → bus.tv
# Replaces pw-loopback service with config-based routing

context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            # Capture from UR23
            capture.props = {
                node.name = "loopback.tv.capture"
                node.description = "TV Audio to Bus"
                target.object = "alsa_input.usb-HiFimeDIY_Audio_UR23_USB_SPDIF_Rx-01.iec958-stereo"
                audio.rate = 48000
                stream.dont-remix = true
                stream.capture.silence = true
            }
            # Playback to bus.tv
            playback.props = {
                node.name = "loopback.tv.playback"
                node.description = "TV Audio to Bus"
                target.object = "bus.tv"
                stream.dont-remix = true
                stream.mute = false
            }
        }
    }
]
