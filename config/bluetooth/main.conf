# BlueZ Configuration for Audio Hub
# Settings for frictionless guest pairing and speaker appearance

[General]
# Device name - will be overridden by unit config
Name = Living Room Speakers
# Class: Audio/Video → Loudspeaker (0x240414 = Speaker + Audio + Rendering)
Class = 0x240414

# Always discoverable and pairable (guest requirement)
DiscoverableTimeout = 0
PairableTimeout = 0

# Auto-enable on boot
AutoEnable = true

# Allow re-pairing without user confirmation (guest forgot device scenario)
JustWorksRepairing = always

[Policy]
# Auto-activate multiple profiles
AutoConnect = true

[A2DP]
# Prefer high quality
AudioConnectToSource = true
