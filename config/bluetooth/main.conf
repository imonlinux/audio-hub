# BlueZ Configuration for Audio Hub
# Settings for frictionless guest pairing and speaker appearance.
# NOTE: keep to keys this bluez build knows — invalid groups/keys are
# logged at every bluetoothd start ("Unknown group A2DP", etc.).

[General]
# Device name - overridden per unit (see howto §5.1)
Name = Living Room Media
# Class: Loudspeaker + Audio + Rendering
Class = 0x240414

# Always discoverable and pairable (guest requirement)
DiscoverableTimeout = 0
PairableTimeout = 0

# Let devices re-pair over stale link keys instead of failing with a
# passkey/key-mismatch error (guest forgot-device scenario)
JustWorksRepairing = always

[Policy]
# Auto-activate the adapter on boot (bluetooth-setup.service also does
# rfkill unblock + power on)
AutoEnable = true
