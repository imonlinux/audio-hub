# UR23 USB S/PDIF Receiver Configuration
# Hifime UR23 USB SPDIF Rx (262a:1048)
# Forces iec958-stereo capture at 48 kHz, disables suspend

monitor.alsa.rules = [
    {
        matches = [
            {
                node.name = "~alsa_input.usb-HiFimeDIY_Audio_UR23_USB_SPDIF_Rx-.*"
                audio.channels = "2"
            }
        ]
        actions = {
            update-props = {
                node.description = "TV Optical Input (UR23)"
                audio.format = "S16LE"
                audio.rate = 48000
                # CRITICAL: Disable suspend - TV is off for long periods
                # Audio must flow instantly when TV turns on
                session.suspend-timeout-seconds = 0
                node.pause-on-idle = false
                # Route to bus.tv by default
                target.object = "bus.tv"
                node.autoconnect = true
            }
        }
    }
]

# Ensure the UR23 card uses the iec958-stereo profile
monitor.alsa.rules = [
    {
        matches = [
            {
                device.name = "~alsa_card.usb-HiFimeDIY_Audio_UR23_USB_SPDIF_Rx-.*"
            }
        ]
        actions = {
            update-props = {
                # Force iec958 profile (PCM only, no Dolby Digital)
                device.profile = "iec958-stereo"
                # Ensure the device doesn't suspend
                api.alsa.disable-pm = true
            }
        }
    }
]
