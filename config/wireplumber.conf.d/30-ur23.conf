# UR23 USB S/PDIF Receiver Configuration
# Hifime UR23 USB SPDIF Rx (262a:1048)
# Forces S16LE/48 kHz capture, disables suspend so audio flows instantly
# when the TV (which may have been off for hours) powers on.
#
# NOTE: no device.profile forcing here. v1 attempted to force
# input:iec958-stereo and the working node was analog-stereo anyway;
# profile forcing is unverified on this hardware and the loopback in
# 40-loopback-tv.conf depends on the real node name.

monitor.alsa.rules = [
    {
        matches = [
            {
                node.name = "~alsa_input.usb-HiFimeDIY_Audio_UR23_USB_SPDIF_Rx-.*"
            }
        ]
        actions = {
            update-props = {
                node.description = "TV Optical Input (UR23)"
                audio.format = "S16LE"
                audio.rate = 48000
                # CRITICAL: keep the capture node alive - the TV is off for
                # long periods and audio must flow instantly when it powers on
                session.suspend-timeout-seconds = 0
                node.pause-on-idle = false
                # Route toward bus.tv (the actual loopback is created by
                # 40-loopback-tv.conf; this property is a hint for policy)
                target.object = "bus.tv"
                node.autoconnect = true
            }
        }
    }
]

# Keep the UR23 card from power-managing itself so the capture node
# persists (and TV audio flows instantly when the TV powers on). Do NOT pin
# device.profile: the profile changes with signal state and the node name
# flips between ...analog-stereo and ...stereo-fallback (40-loopback-tv.conf
# covers both).
monitor.alsa.rules = [
    {
        matches = [
            {
                device.name = "~alsa_card.usb-HiFimeDIY_Audio_UR23_USB_SPDIF_Rx-.*"
            }
        ]
        actions = {
            update-props = {
                api.alsa.disable-pm = true
            }
        }
    }
]
