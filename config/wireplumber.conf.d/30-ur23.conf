# UR23 USB S/PDIF Receiver Configuration
# Hifime UR23 USB SPDIF Rx (262a:1048)
#
# One monitor.alsa.rules array with two rules (node props + card props).
# - S16LE/48 kHz, suspend disabled: audio flows instantly when the TV
#   (which may have been off for hours) powers on, and the node persists.
# - priority.driver = 50: keeps the UR23 from winning the graph's
#   driver/clock role. With suspend disabled the source runs even without
#   signal, and a stalled S/PDIF clock as graph driver degrades playback
#   from the other sources while the TV is off.
#
# NOTE: the capture node name flips between ...analog-stereo (signal) and
# ...stereo-fallback (probing); 40-loopback-tv.conf covers both names.

monitor.alsa.rules = [
    {
        matches = [
            {
                node.name = "~alsa_input.usb-HiFimeDIY_Audio_UR23_USB_SPDIF_Rx-.*"
            }
        ]
        actions = {
            update-props = {
                node.description = "TV Optical Input (UR23)"
                audio.format = "S16LE"
                audio.rate = 48000
                # NOTE: the pipewire property is "priority.driver" (not
                # "node.priority.driver" — that variant is silently ignored)
                priority.driver = 50
                # CRITICAL: keep the capture node alive - audio must flow
                # instantly when the TV powers on
                session.suspend-timeout-seconds = 0
                node.pause-on-idle = false
                # Route toward bus.tv (the actual loopback is created by
                # 40-loopback-tv.conf; this property is a hint for policy)
                target.object = "bus.tv"
                node.autoconnect = true
            }
        }
    }
    {
        matches = [
            {
                device.name = "~alsa_card.usb-HiFimeDIY_Audio_UR23_USB_SPDIF_Rx-.*"
            }
        ]
        actions = {
            update-props = {
                api.alsa.disable-pm = true
            }
        }
    }
]
