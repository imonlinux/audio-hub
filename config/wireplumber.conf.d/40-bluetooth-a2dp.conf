# Bluetooth A2DP Sink Configuration
# Pi RECEIVES audio (acts as a Bluetooth speaker).
#
# This is the config that registered the Audio Sink UUID in this environment
# (bluez5.roles = [a2dp_sink] + seat-monitoring disabled). The autoswitch-to-
# headset-profile setting from the howto is held back for now — adding the
# wireplumber.settings block alongside monitor.bluez.properties appeared to
# stop the endpoint from registering; it can be layered in separately later.

wireplumber.profiles = {
    main = {
        monitor.bluez.seat-monitoring = disabled
    }
}

monitor.bluez.properties = {
  bluez5.roles  = [ a2dp_sink ]
  bluez5.codecs = [ sbc sbc_xq aac ]
}

monitor.bluez.rules = [
    {
        matches = [
            { "node.name" = "~bluez_input.*" }
            { "node.name" = "~bluez_output.*" }
        ]
        actions = {
            update-props = {
                "target.object"    = "bus.bt"
                "node.autoconnect" = true
            }
        }
    }
]
