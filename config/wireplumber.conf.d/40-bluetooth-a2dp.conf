# Bluetooth A2DP Sink Configuration
# Pi RECEIVES audio (acts as a Bluetooth speaker).
#
# This is the EXACT proven working config from the original implementation
# (see plan-a-implementation-guide.md §5.4, §10.3), adapted only to route to
# the new bus.bt node instead of the old vsink.program.
#
#   bluez5.roles = [ a2dp_sink ]   <- forces Pi to A2DP-sink-only (correct)
#   match bluez_input.*            <- a2dp-sink node is named bluez_input.*
#
# Per original troubleshooting: after changing roles, restart BOTH bluetooth
# and wireplumber, and re-pair the device (role changes invalidate the bond).

wireplumber.profiles = {
    main = {
        monitor.bluez.seat-monitoring = disabled
    }
}

monitor.bluez.properties = {
    bluez5.roles = [ a2dp_sink ]
}

monitor.bluez.rules = [
    {
        matches = [
            { "node.name" = "~bluez_input.*" }
            { "node.name" = "~bluez_output.*" }
        ]
        actions = {
            update-props = {
                "target.object"    = "bus.bt"
                "node.autoconnect" = true
            }
        }
    }
]
