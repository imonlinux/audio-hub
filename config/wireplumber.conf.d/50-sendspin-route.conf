# Sendspin / Music Assistant Routing
# Routes Sendspin stream to bus.music by stable name

# Route any stream with "sendspin" in the name to bus.music
node.rules = [
    {
        matches = [
            {
                # Match Sendspin client
                application.name = "~sendspin.*"
                media.class = "Stream/Output/Audio"
            }
        ]
        actions = {
            update-props = {
                target.object = "bus.music"
                node.autoconnect = true
            }
        }
    }
    {
        matches = [
            {
                # Also match by node.name as fallback
                node.name = "~sendspin.*"
                media.class = "Stream/Output/Audio"
            }
        ]
        actions = {
            update-props = {
                target.object = "bus.music"
                node.autoconnect = true
            }
        }
    }
]
